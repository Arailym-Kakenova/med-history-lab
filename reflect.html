<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MED HISTORY LAB</title>
<style>:root{--em:#0f4c45;--teal:#0b3b3f;--navy:#12263f;--gold:#b08d4a;--gold2:#d8bd82;--cream:#f6f0e1;--paper:#fffdf7;--ink:#17302f;--mut:#566d6a;--line:#ddd4bd;--ok:#1d7a4d;--bad:#a23b2a}
*{box-sizing:border-box}
body{margin:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.sans,button,nav,small,summary,label,.tag{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:clamp(30px,5.5vw,56px);line-height:1.08;margin:.2em 0;letter-spacing:.5px}
h2{font-size:clamp(22px,3.2vw,32px);line-height:1.2;margin:1.6em 0 .5em;color:var(--teal)}
h2:first-child{margin-top:.2em}
h3{font-size:19px;margin:.2em 0 .5em;color:var(--teal)}
h4{margin:.8em 0 .3em;color:var(--em)}
a{color:#0d6a70}
a:hover{color:var(--gold)}
.top{background:linear-gradient(135deg,var(--teal),var(--em) 60%,var(--navy));color:#fff;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(216,189,130,.05) 0 2px,transparent 2px 14px);pointer-events:none}
.wrap{max-width:1120px;margin:auto;padding:0 20px;position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.brand b{font:700 17px/1.1 system-ui,sans-serif;letter-spacing:2px}
.brand small{display:block;font-weight:400;letter-spacing:1px;color:var(--gold2);font-size:11px}
.lang{display:flex;gap:6px}
.lang button{background:transparent;border:1px solid var(--gold2);color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:14px}
.lang button.on{background:var(--gold);border-color:var(--gold);color:#10201f;font-weight:700}
nav.menu{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 12px}
nav.menu a{color:#e8efe9;text-decoration:none;font:14px system-ui,sans-serif;padding:6px 11px;border-radius:6px;border:1px solid transparent}
nav.menu a:hover{border-color:var(--gold2)}
nav.menu a.on{background:rgba(216,189,130,.22);border-color:var(--gold2);color:#fff}
.hero{padding:34px 0 44px}
.hero .kick{font:12px system-ui,sans-serif;letter-spacing:3px;color:var(--gold2);text-transform:uppercase}
.hero p.sub{font-size:19px;max-width:760px;color:#dfeae4;margin:.3em 0}
.hero.compact{padding:18px 0 26px}
.hero.compact h1{font-size:clamp(26px,4vw,40px)}
.slogan{border-left:3px solid var(--gold);padding-left:14px;margin-top:18px;font-style:italic;color:var(--gold2);font-size:18px}
main.wrap{padding-top:26px;padding-bottom:40px}
.card,details.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid .card{margin:0}
a.tile{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:18px;transition:.15s}
a.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,76,69,.15);border-top-color:var(--em)}
a.tile .n{font:700 12px system-ui;letter-spacing:2px;color:var(--gold)}
a.tile b{display:block;font:700 18px system-ui;color:var(--teal);margin:4px 0}
a.tile span{color:var(--mut);font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.flow .st{flex:1 1 150px;background:var(--teal);color:#fff;border-radius:10px;padding:12px 14px;position:relative;font:14px/1.35 system-ui,sans-serif}
.flow .st b{display:block;color:var(--gold2);font-size:12px;letter-spacing:2px;margin-bottom:4px}
.flow .st:not(:last-child):after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:20px;z-index:2}
@media(max-width:700px){.flow .st:not(:last-child):after{content:"↓";right:50%;top:auto;bottom:-17px;transform:translateX(50%)}.flow .st{flex-basis:100%}}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:#e8dfc5;color:#5a4818;margin:2px 4px 2px 0}
.tag.real{background:#d6ebdf;color:#16583a}.tag.fic{background:#f1dcd6;color:#7a2d20}.tag.warn{background:#f6e7b8;color:#6b5100}
button,.btn{font:600 15px system-ui,sans-serif;cursor:pointer;border:1px solid var(--em);border-radius:8px;background:#fff;color:var(--em);padding:9px 14px;margin:4px 6px 4px 0;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--em);color:#fff}
button.pri,.btn.pri{background:var(--em);color:#fff}
button.pri:hover{background:var(--teal)}
button.opt{display:block;width:100%;text-align:left;margin:6px 0;border-color:var(--line);color:var(--ink);font-weight:500;background:#fff}
button.opt:hover{border-color:var(--gold);background:#fbf5e3;color:var(--ink)}
button.opt.sel{border-color:var(--em);background:#e4f0ec;color:var(--ink)}
button.opt.right{border-color:var(--ok);background:#dff2e7;color:var(--ink)}
button.opt.wrong{border-color:var(--bad);background:#f8e2dd;color:var(--ink)}
button:disabled{opacity:.6;cursor:default}
.fb{border-left:4px solid var(--gold);background:#fbf5e3;padding:10px 14px;margin:10px 0;border-radius:0 8px 8px 0}
.fb.ok{border-color:var(--ok);background:#e6f4ec}.fb.no{border-color:var(--bad);background:#faebe7}
details>summary{cursor:pointer;font-weight:600;color:var(--teal)}
details[open]>summary{margin-bottom:8px}
details.env{background:#f3e9cc;border:1px solid #d6c28a;border-radius:10px;padding:10px 14px;margin:8px 0}
details.env>summary:before{content:"✉ ";color:var(--gold)}
.doc{background:#fff;border:1px dashed #b9a977;border-radius:6px;padding:10px 14px;margin:8px 0;font-size:15px}
.doc b.sans{font-size:11px;letter-spacing:2px;color:var(--gold);display:block}
.caseno{font:700 13px system-ui;letter-spacing:3px;color:var(--gold)}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:90px}
label{display:block;font-weight:600;margin:12px 0 4px}
.warn{background:#fdf4d8;border:1px solid #e3cd83;border-radius:10px;padding:10px 14px;font:14px/1.5 system-ui,sans-serif;color:#5d4a0b;margin:12px 0}
.person{display:grid;grid-template-columns:150px 1fr;gap:18px}
.portrait{width:150px;height:190px;border-radius:10px;background:linear-gradient(160deg,var(--teal),var(--navy));color:var(--gold2);display:flex;align-items:center;justify-content:center;font:700 44px Georgia,serif;text-align:center;flex-direction:column}
.portrait small{font:11px system-ui;letter-spacing:1px;color:#cfe0da;padding:0 8px;margin-top:6px}
@media(max-width:640px){.person{grid-template-columns:1fr}.portrait{width:100%;height:110px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{margin:0;border-radius:20px;padding:7px 14px}
.chips button.on{background:var(--em);color:#fff}
.tl{display:flex;overflow-x:auto;gap:0;margin:14px 0;padding-bottom:6px;border-bottom:3px solid var(--gold)}
.tl button{flex:0 0 auto;border:0;border-radius:0;background:transparent;margin:0;padding:10px 14px;border-bottom:4px solid transparent;color:var(--mut);white-space:nowrap}
.tl button.on{color:var(--teal);border-bottom-color:var(--em);background:#efe6cc}
.tl button:hover{background:#efe6cc;color:var(--teal)}
.bar2{height:10px;background:#e5dcc3;border-radius:6px;overflow:hidden}.bar2>i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .3s}
.big{font:700 44px system-ui;color:var(--em)}
table{border-collapse:collapse;width:100%;font:15px/1.45 system-ui,sans-serif;background:#fff}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--teal);color:#fff}
.tw{overflow-x:auto}
.photo{float:left;width:min(38%,230px);border-radius:12px;margin:0 22px 12px 0;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cred{font-size:20px;font-style:italic;color:var(--teal);border-left:4px solid var(--gold);padding:6px 16px;margin:16px 0}
.list li{margin:5px 0}
ul.list{padding-left:20px}
iframe.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.src{font:14px system-ui,sans-serif;color:var(--mut)}
.timer{font:700 28px system-ui;color:var(--gold);float:right}
footer{background:var(--teal);color:#cfe0da;text-align:center;padding:22px 16px;font:14px/1.6 system-ui,sans-serif}
footer b{color:var(--gold2)}
.embed .top .menu{display:none}
.embed .hero.compact{padding:8px 0 12px}.embed .hero.compact .kick,.embed .hero.compact .sub{display:none}
.embed .top{background:var(--teal)}
.embed .bar{padding:8px 0}
.embed main.wrap{padding-top:12px}
@media print{.top .lang,nav.menu,button{display:none}}
</style></head>

 const c=CASES[i],st=mem.cs[i]||{};

 <h4>${L('Улики','Дәлелдер')}</h4>${c.clues.map((cl,k)=>`<details class="env" ${((mem.open||{})[i+'_'+k])?'open':''} ontoggle="(mem.open=mem.open||{})['${i}_${k}']=this.open"><summary>${esc(tt(cl[0]))}</summary>${esc(tt(cl[1]))}</details>`).join('')}

 ${st.done?`<div class="fb ${ok?'ok':'no'}" role="status"><b>${ok?L('Верно.','Дұрыс.'):L('Пересмотрите ответ.','Жауапты қайта қараңыз.')}</b> ${L('Правильный ответ','Дұрыс жауап')}: <b>${String.fromCharCode(65+c.a)}</b>. ${esc(tt(c.ex))}</div><div class="fb"><b>${L('Профессионально-ценностная рефлексия:','Кәсіби-құндылықтық рефлексия:')}</b> ${esc(tt(c.rf))}</div>`:''}</article>`;

function cscore(){const d=Object.values(mem.cs).filter(x=>x.done).length,r=Object.entries(mem.cs).filter(([i,x])=>x.done&&x.sel===CASES[i].a).length;return `${L('Решено дел','Өтілген іс')}: ${d}/10 · ${L('верно','дұрыс')}: ${r}`}
/* демонстрация 90 секунд */
const DSTEPS=()=>[[L('1. Ситуация','1. Жағдаят'),L('Прочитайте проблемную ситуацию.','Мәселелік жағдаятты оқыңыз.')],[L('2. Улики','2. Дәлелдер'),L('Откройте конверты с уликами.','Дәлелдер салынған конверттерді ашыңыз.')],[L('3. Источники','3. Дереккөздер'),L('Оцените тип и достоверность источников.','Дереккөздердің түрі мен сенімділігін бағалаңыз.')],[L('4. Решение','4. Шешім'),L('Выберите ответ и проверьте.','Жауапты таңдап, тексеріңіз.')],[L('5. Рефлексия','5. Рефлексия'),L('Свяжите вывод с профессией медика.','Қорытындыны медик мамандығымен байланыстырыңыз.')]];
function demoStart(){clearInterval(mem.dt);mem.demo={s:0,t:90};mem.dt=setInterval(()=>{if(!mem.demo)return;mem.demo.t--;if(mem.demo.t%18===0&&mem.demo.s<4)mem.demo.s++;if(mem.demo.t<=0){clearInterval(mem.dt)}demoDraw()},1000);demoDraw()}
function demoStop(){clearInterval(mem.dt);mem.demo=null;demoDraw()}
function demoNext(){if(mem.demo&&mem.demo.s<4){mem.demo.s++;demoDraw()}}
function demoDraw(){const e=$('#demo');if(e)e.innerHTML=demoHTML()}

 if(!mem.demo)return `<button class="pri" onclick="demoStart()">▶ ${L('Показать расследование за 90 секунд','90 секундта зерттеуді көрсету')}</button>`;
 const d=mem.demo,S=DSTEPS();
 return `<div class="card" style="border-color:var(--gold)"><span class="timer">${Math.max(0,Math.floor(d.t/60))}:${String(Math.max(0,d.t%60)).padStart(2,'0')}</span><b class="sans">${L('РЕЖИМ ПОКАЗА · ДЕЛО №01','КӨРСЕТУ РЕЖИМІ · №01 ІС')}</b><div class="bar2" style="margin:10px 0"><i style="width:${(d.s+1)*20}%"></i></div>${S.map((s,i)=>`<p style="margin:4px 0;${i===d.s?'font-weight:700;color:var(--em)':'opacity:.55'}">${s[0]} — ${s[1]}</p>`).join('')}<button onclick="demoNext()">${L('Далее','Келесі')}</button><button onclick="demoStop()">${L('Закончить','Аяқтау')}</button><p class="src">${L('Выполняйте шаги в карточке дела №01 ниже.','Қадамдарды төмендегі №01 іс карточкасында орындаңыз.')}</p></div>`;
}

mem.tab='test';mem.ta={};
const TESTQ=()=>CASES.map(c=>({q:c.q,o:c.o,a:c.a,f:c.ex,src:'case',ctx:c.t})).concat(NEWQ.map(n=>Object.assign({},n,{src:'new'})));
const lv=(k)=>store.get('diag_'+k);
function diagHTML(k){
 const sv=lv(k),ans=mem['d'+k]||(sv&&sv.a)||{};
 const done=Object.keys(ans).length===DIAG.length;
 const sum=Object.values(ans).reduce((a,b)=>a+b,0),pct=Math.round(sum/(DIAG.length*4)*100);
 const e=lv('entry'),f=lv('final');
 return `<div class="card"><p>${k==='entry'?L('Входная диагностика исторического мышления (самооценка).','Тарихи ойлаудың кіріс диагностикасы (өзін-өзі бағалау).'):L('Итоговая диагностика исторического мышления (самооценка).','Тарихи ойлаудың қорытынды диагностикасы (өзін-өзі бағалау).')} <span class="tag warn">${L('Данные остаются только в вашем браузере. Фиктивные результаты не создаются.','Деректер тек сіздің браузеріңізде қалады. Жалған нәтижелер жасалмайды.')}</span></p>
 ${DIAG.map((d,i)=>`<div style="margin:10px 0"><b>${i+1}. ${esc(tt(d))}</b><br>${[1,2,3,4].map(v=>`<button class="opt ${ans[i]===v?'sel':''}" style="display:inline-block;width:auto;min-width:46px;text-align:center" onclick="(mem['d${k}']=mem['d${k}']||Object.assign({},(lv('${k}')||{}).a))[${i}]=${v};draw()">${v}</button>`).join('')}</div>`).join('')}
 <p class="src">1 — ${L('редко / не умею','сирек / білмеймін')} · 4 — ${L('уверенно / всегда','сенімді / әрдайым')}</p>
 <button class="pri" ${done?'':'disabled'} onclick="saveDiag('${k}')">${L('Сохранить результат','Нәтижені сақтау')}</button>
 ${done?`<p><b>${L('Результат','Нәтиже')}: ${pct}%</b></p>`:''}
 ${e&&f?`<div class="fb"><b>${L('Сравнение входной и итоговой самооценки','Кіріс және қорытынды өзін-өзі бағалауды салыстыру')}:</b> ${e.p}% → ${f.p}% (${f.p-e.p>=0?'+':''}${f.p-e.p} ${L('п. п.','п. п.')})</div>`:''}</div>`;
}
function saveDiag(k){const a=mem['d'+k]||(lv(k)||{}).a;const s=Object.values(a).reduce((x,y)=>x+y,0);store.set('diag_'+k,{a,p:Math.round(s/(DIAG.length*4)*100),d:new Date().toISOString().slice(0,10)});draw()}
R.test=()=>{
 const tabs=[['entry',L('Входная диагностика','Кіріс диагностикасы')],['test',L('Тест','Тест')],['final',L('Итоговая диагностика','Қорытынды диагностика')]].map(t=>`<button class="${mem.tab===t[0]?'on':''}" onclick="mem.tab='${t[0]}';draw()">${t[1]}</button>`).join('');
